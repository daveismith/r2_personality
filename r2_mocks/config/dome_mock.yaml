effects:
- name: coords
  summary: 'bench: each cell''s colour encodes its position, r 16+8x g 16+16y b 32'
- name: sweep
  summary: 'bench: a column crossing left to right, 100 ms a step at speed 5'
- name: drop
  summary: 'bench: a row falling top to bottom, 100 ms a step at speed 5'
- name: wipe
  summary: 'bench: fills column by column, 100 ms a step at speed 5, then ends'
- name: blink
  summary: 'bench: all on, then all off, 500 ms each at speed 5'
- name: rainbow
  summary: a drift turning through every hue, a turn each 4 s at speed 5
- name: lightsout
  summary: fades what is showing to black over 2 s at speed 5, and holds it
- name: roam
  summary: one cell wandering to a neighbour each 100 ms at speed 5, trailing
- name: fire
  summary: flames rising from the bottom row, a step each 30 ms at speed 5
- name: cycle
  summary: the others in turn, chosen at random, 10 s each at speed 5
- name: micbright
  summary: the colour, as bright as the audio level
- name: micrainbow
  summary: 'a level meter: columns lit from the left, green to red'
- name: redalert
  summary: red at the audio level, every cell flickering
- name: leia
  summary: pale green at the audio level, every cell flickering

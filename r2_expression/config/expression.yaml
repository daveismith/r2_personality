# expression.yaml: the arbiters' settings and R2's mood palettes (r2_expression).
# Schema: r2_expression/README.md. One entry per mood of r2_affect's affect.yaml.
# Ambient knobs are the drift preset (calm | lively) and brightness, per palette channel:
#   fld, rld: drift and brightness (percent; [min, max] is scaled by mood_strength)
#   psi:      brightness only (the PSIs have no drift)
#   magic:    brightness 0-15
# Never hue: it is the droid's colour scheme, not a mood knob (plan rule 9).
# Floors (plan 2.6): logics are invisible below ~25 %, the PSIs stay visible down to ~20.
# Reds: annoyed and scared use alarm / flash / redalert and Magic Panel Alert (6) and Alert long (7).
# Flourishes: every_s [min, max] seconds apart, one weighted pick at a time, sent at idle
# priority with a duration (never 0; capped at max_duration_ms). Clip and effect names are
# checked against ListLeds at startup, sequences against ListMagicPanel; a pick the device
# lacks is dropped with one WARN.
# Dome (phase 2 plan 4.5): each mood names a motion profile (profiles below), optional idle
# glances (every_s, amplitude_rad, dwell_s: [min, max]; mood_strength pulls every_s toward
# its lower bound) and an optional rest heading, rest_rad: a bearing, +ve left, 0 forward.
# The dome is only ever driven by velocity, through dome_twist_converter, at idle priority
# for glances and rest; a joystick or Foxglove command beats it at once.
# Sound (phase 3 plan 4.4): each mood's voice is sound: {gain_db, chatter: {every_s, pools}}. Pools
# are tags of the player's catalogue (the fixed list of the plan's step 0, never excluded); a pool
# is picked by weight, then a clip uniformly within it. A pool with no playable clip is dropped
# with one WARN, a mood with none left falls back to the chatter pool. gain_db (-20..+6) is added
# to the personality's plays only; chatter is idle priority, never while claimed, stale or playing.
# The pool `voice` is not a tag: its picks are phrases the player's synthesiser renders from the
# mood's arousal and valence (plan 4.4, step 7); it is dropped with one WARN when there is no synth.

defaults:
  manual_hold_s: 5.0       # a manual intent holds its channel this long after it
  mood_stale_s: 3.0        # /mood/state older than this: neutral palette, no flourishes
  max_duration_ms: 30000   # cap on every personality-sent run and sequence
  status_hz: 2.0
  max_lease_s: 60.0        # cap on a ClaimChannel lease
  device_stale_s: 5.0      # no state message for this long: OFFLINE
  dome:
    # Every command is 0 or at least min_speed. The droid's velocity_map zeroes a positive
    # command under about 0.44 rad/s and a negative one under about 0.567 rad/s: above both.
    min_speed_rad_s: 0.6
    # The renderer's own clamps. The converter's personality_max_speed_rad_s and
    # personality_max_accel_rad_s2 are the authority; keep these equal to them.
    max_speed_rad_s: 2.0
    max_accel_rad_s2: 6.0
    max_move_s: 8.0        # every move ends by then (a glance: plus its dwell)
    settle_s: 0.8          # wait after the stop before judging where the dome came to rest
    retries: 2             # outside the band after settling: a floor-speed pulse (close by) or approach, this many times
    feedback_timeout_s: 0.5  # no new joint state for this long: the move ends with a 0
    max_plausible_rad_s: 4.0  # a joint state implying a faster dome than this is held back (ring sensor misreads)
    rest_recheck_s: 30.0   # a resting dome that drifted is corrected at most this often
    # Run-on after a 0: c1 * v - c2, measured on the droid 2026-10-23 (8b). learn: false keeps the
    # scale at 1.0 (the fit is trusted; five consecutive moves learned 0.2 to 1.2 from noise). With
    # learn: true each lesson moves the scale learn_rate of the way to the observed ratio, within scale_limits.
    coast: {c1_s: 0.52, c2_rad: 0.0, learn: false, scale_limits: [0.7, 1.4], learn_rate: 0.3}
    # What the dome does at min_speed (0.6 gave 0.35 rad/s and a 0.12 rad run-on): a retry from
    # closer than final_pulse_below_rad is one pulse of min_speed for
    # clamp((|err| - coast_rad) / speed_rad_s, 0.1, 0.6) s, then the stop and the check again.
    floor: {coast_rad: 0.12, speed_rad_s: 0.35}   # speed_rad_s is the ACHIEVED speed
    final_pulse_below_rad: 0.35
    heading: {sign: -1, offset_rad: 0.0}  # joint positive = clockwise, bearings +ve left
    body_speed_m_s: 0.15   # body faster than this (or yawing faster than below): SUPPRESSED
    body_yaw_rad_s: 0.3
    after_foreign_s: 3.0   # no idle glance this long after a joystick or Foxglove lets go
    after_still_s: 1.0     # SUPPRESSED clears this long after the body is still
  # Sound (phase 3 plan 4.4).
  sound:
    house_level_dbfs: -16  # what the catalogue's gain_db targets (the player's, informational here)
    fade_ms: 20            # the fade of a pre-empted or cut sound (the player's, informational here)
    interruptible: false   # the default for a sound intent that does not say: equal priority waits
    level: {floor_dbfs: -40, ceiling_dbfs: -6}   # /sound/level onto 0-255 (the player's)

# Named dome motion profiles, for moods and for an intent's params.profile.
profiles:
  snappy: {v_max: 2.0, accel: 4.0, k: 3.0, settle_band_rad: 0.15}
  smooth: {v_max: 1.0, accel: 1.5, k: 1.5, settle_band_rad: 0.15}
  lazy:   {v_max: 0.6, accel: 0.8, k: 1.0, settle_band_rad: 0.15}

# While the mood is stale, and for any mood without an entry: the device's own default
# look. The Magic Panel is left untouched.
neutral:
  fld: {drift: calm, brightness: 40}
  rld: {drift: calm, brightness: 40}
  psi: {brightness: 40}
  dome: {profile: smooth}  # no glances, no rest
  sound: {gain_db: -6}     # stale: no chatter, manual only, quieter

moods:
  calm:
    fld:   {drift: calm, brightness: [50, 65]}
    rld:   {drift: calm, brightness: [50, 65]}
    psi:   {brightness: [50, 65]}
    magic: {brightness: 5}
    dome: {profile: smooth,
           glance: {every_s: [20, 60], amplitude_rad: [0.26, 0.70], dwell_s: [0.5, 1.5]}}
    flourish:
      every_s: [40, 90]
      picks:
        - {channel: fld, clip: pulse, rgb: 0x2060ff, weight: 2, duration_ms: 2560}
        - {channel: psi, clip: pulse, rgb: 0x2060ff, weight: 1, duration_ms: 2560}
    sound: {gain_db: -3,
            chatter: {every_s: [45, 120], pools: {chatter: 3, hum: 1}}}

  curious:
    fld:   {drift: lively, brightness: [55, 75]}
    rld:   {drift: calm, brightness: [55, 70]}
    psi:   {brightness: [55, 75]}
    magic: {brightness: 7}
    dome: {profile: snappy,
           glance: {every_s: [8, 20], amplitude_rad: [0.5, 1.4], dwell_s: [0.8, 2.0]}}
    flourish:
      every_s: [20, 45]
      picks:
        - {channel: fld, clip: hscan, rgb: 0x20c0ff, weight: 2, duration_ms: 2100}
        - {channel: fld, effect: roam, weight: 2, duration_ms: 6000}
        - {channel: rld, effect: cycle, weight: 1, duration_ms: 10000}        # one child
        - {channel: rld, clip: vscan, rgb: 0x20c0ff, weight: 1, duration_ms: 1800}
        - {channel: psi, clip: pulse, rgb: 0x20c0ff, weight: 1, duration_ms: 2560}
        - {channel: magic, sequence: 23, weight: 1, duration_ms: 4000}       # Eye scan
    sound: {gain_db: 0,
            chatter: {every_s: [15, 40], pools: {question: 3, ooh: 2, chatter: 1, voice: 1}}}

  excited:
    fld:   {drift: lively, brightness: [80, 100]}
    rld:   {drift: lively, brightness: [80, 100]}
    psi:   {brightness: [80, 100]}
    magic: {brightness: 12}
    dome: {profile: snappy,
           glance: {every_s: [4, 10], amplitude_rad: [0.3, 0.9], dwell_s: [0.2, 0.6]}}
    flourish:
      every_s: [6, 15]
      picks:
        - {channel: fld, effect: rainbow, weight: 3, duration_ms: 4000}
        - {channel: psi, clip: flash, rgb: 0xff2200, weight: 2, duration_ms: 1200}
        - {channel: magic, sequence: 27, weight: 2, duration_ms: 3500}       # Flash halves (3.3 s)
    sound: {gain_db: 2,
            chatter: {every_s: [6, 15], pools: {excited: 4, laugh: 1, chatter: 1, voice: 1}}}

  playful:
    fld:   {drift: lively, brightness: [65, 85]}
    rld:   {drift: lively, brightness: [60, 80]}
    psi:   {brightness: [65, 85]}
    magic: {brightness: 9}
    dome: {profile: snappy,
           glance: {every_s: [6, 15], amplitude_rad: [0.4, 1.1], dwell_s: [0.3, 0.9]}}
    flourish:
      every_s: [10, 25]
      picks:
        - {channel: fld, clip: colourswap, weight: 2, duration_ms: 2100}
        - {channel: rld, clip: flipflop, weight: 1, duration_ms: 1600}
        - {channel: psi, clip: flipflop-alt, weight: 1, duration_ms: 1600}
        - {channel: magic, sequence: 46, weight: 1, duration_ms: 2000}       # Heart
    sound: {gain_db: 0,
            chatter: {every_s: [10, 30], pools: {laugh: 2, whistle: 1, ooh: 1, chatter: 1, voice: 1}}}

  annoyed:
    fld:   {drift: lively, brightness: [60, 80]}
    rld:   {drift: lively, brightness: [55, 75]}
    psi:   {brightness: [60, 80]}
    magic: {brightness: 8}
    dome: {profile: snappy,
           glance: {every_s: [15, 40], amplitude_rad: [0.2, 0.5], dwell_s: [0.3, 0.8]}}
    flourish:
      every_s: [15, 35]
      picks:
        - {channel: fld, clip: alarm, rgb: 0xff3000, weight: 2, duration_ms: 1500}
        - {channel: fld, effect: redalert, weight: 1, duration_ms: 2500}
        - {channel: rld, clip: hscan, rgb: 0xff4000, weight: 1, duration_ms: 2300}
        - {channel: psi, clip: flash, rgb: 0xff0000, weight: 1, duration_ms: 1000}
        - {channel: magic, sequence: 6, weight: 1, duration_ms: 4700}        # Alert (4.6 s)
    sound: {gain_db: 0,
            chatter: {every_s: [20, 60], pools: {annoyed: 3, alarm: 1}}}

  scared:
    fld:   {drift: lively, brightness: [70, 90]}
    rld:   {drift: lively, brightness: [65, 85]}
    psi:   {brightness: [70, 90]}
    magic: {brightness: 10}
    dome: {profile: snappy,
           glance: {every_s: [5, 12], amplitude_rad: [0.4, 1.2], dwell_s: [0.2, 0.5]}}
    flourish:
      every_s: [8, 20]
      picks:
        - {channel: fld, clip: alarm-twinkle, rgb: 0xffffff, weight: 2, duration_ms: 3000}
        - {channel: rld, effect: redalert, weight: 1, duration_ms: 2500}
        - {channel: psi, clip: flash, rgb: 0xffffff, weight: 2, duration_ms: 800}
        - {channel: magic, sequence: 7, weight: 2, duration_ms: 11500}       # Alert long (11.4 s)
        - {channel: magic, sequence: 42, weight: 1, duration_ms: 2100}       # Flicker
    sound: {gain_db: 1,
            chatter: {every_s: [8, 20], pools: {scared: 3, scream: 1, alarm: 1}}}

  sleepy:
    fld:   {drift: calm, brightness: [25, 35]}    # below ~25 the logics are black (2.6)
    rld:   {drift: calm, brightness: [25, 35]}
    psi:   {brightness: [20, 30]}                 # the PSIs floor at ~18/255 and stay visible
    magic: {brightness: 1}
    dome: {profile: lazy, rest_rad: 0.35,
           glance: {every_s: [120, 300], amplitude_rad: [0.1, 0.3], dwell_s: [2.0, 4.0]}}
    flourish:
      every_s: [120, 300]
      picks:
        - {channel: fld, effect: lightsout, weight: 1, duration_ms: 6000}  # holds forever: always timed
        - {channel: psi, clip: pulse, rgb: 0x4040ff, weight: 2, duration_ms: 5120}
        - {channel: magic, sequence: 25, weight: 1, duration_ms: 2300}       # Fade out
    sound: {gain_db: -8,
            chatter: {every_s: [90, 240], pools: {sleepy: 3, hum: 1}}}

  sulking:
    fld:   {drift: calm, brightness: [30, 45]}
    rld:   {drift: calm, brightness: [30, 45]}
    psi:   {brightness: [25, 40]}
    magic: {brightness: 2}
    dome: {profile: lazy, rest_rad: 2.6,      # rests looking away
           glance: {every_s: [60, 150], amplitude_rad: [0.1, 0.3], dwell_s: [1.5, 3.0]}}
    flourish:
      every_s: [60, 150]
      picks:
        - {channel: psi, clip: pulse, rgb: 0x6020a0, weight: 2, duration_ms: 2560}
        - {channel: fld, clip: fadescroll, rgb: 0x4020a0, weight: 1, duration_ms: 6000}
        - {channel: magic, sequence: 45, weight: 1, duration_ms: 1500}       # Sad face
    sound: {gain_db: -4,
            chatter: {every_s: [60, 180], pools: {sad: 3, chatter: 1}}}
